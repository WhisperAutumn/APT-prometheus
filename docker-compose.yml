name: pg-monitor

services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: pg-monitor-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pg-monitor-prometheus-data:/prometheus
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    networks:
      - pg-monitor-net

  grafana:
    image: grafana/grafana:13.1.1
    container_name: pg-monitor-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - pg-monitor-grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 512m
    networks:
      - pg-monitor-net

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: pg-monitor-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /run/udev/data:/run/udev/data:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    networks:
      - pg-monitor-net

networks:
  pg-monitor-net:
    name: pg-monitor-net

volumes:
  pg-monitor-prometheus-data:
    name: pg-monitor-prometheus-data
  pg-monitor-grafana-data:
    name: pg-monitor-grafana-data
